name: Bump App Version
on:
  push:
    branches: ["main"]
permissions:
  contents: write
concurrency:
  group: app-version-bump
  cancel-in-progress: false
jobs:
  bump-version:
    if: ${{ !contains(github.event.head_commit.message, '[skip version bump]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Increment app version
        run: node scripts/bump-version.js
      - name: Commit version for the deployment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          if git diff --cached --quiet; then
            echo "No version change needed."
            exit 0
          fi
          VERSION=$(node -p "require('./package.json').version")
          git commit -m "chore: bump app version to v$VERSION [skip version bump]"
          git push origin HEAD:main
