name: Bump Field App Version
on:
  push:
    branches: ["main"]
permissions:
  contents: write
concurrency:
  group: field-app-version-bump
  cancel-in-progress: false
jobs:
  bump-field-version:
    if: ${{ !contains(github.event.head_commit.message, '[skip field version bump]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Increment field app version
        run: node scripts/bump-field-version.js
      - name: Commit field app version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add field-version.json
          if git diff --cached --quiet; then
            echo "No field app version change needed."
            exit 0
          fi
          VERSION=$(node -p "require('./field-version.json').version")
          git commit -m "chore: bump field app version to v$VERSION [skip field version bump]"
          git pull --rebase origin main
          git push origin HEAD:main
