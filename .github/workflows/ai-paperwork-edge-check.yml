name: AI Paperwork Edge Function Check
on:
  pull_request:
    branches: ["main"]
    paths:
      - "supabase/functions/ai-paperwork-audit/**"
  push:
    branches: ["main"]
    paths:
      - "supabase/functions/ai-paperwork-audit/**"
jobs:
  deno-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/ai-paperwork-audit/index.ts
