<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f2141" />
  <title>DV Back Office — Offline</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f6f8;color:#17233b;font-family:system-ui,sans-serif}.card{width:min(420px,100%);padding:30px;border:1px solid #e6e9ee;border-radius:16px;background:#fff;text-align:center;box-shadow:0 8px 28px rgba(15,33,65,.08)}img{width:58px;height:58px;object-fit:contain}.card h1{margin:18px 0 8px;color:#0f2141;font-size:22px}.card p{margin:0;color:#68758a;line-height:1.55}.card button{margin-top:22px;padding:12px 18px;border:0;border-radius:8px;background:#9e8556;color:#fff;font-weight:700}
  </style>
</head>
<body>
  <main class="card">
    <img src="/dv-logo.svg" alt="Dream Valley Realty" />
    <h1>You’re offline</h1>
    <p>DV Back Office needs an internet connection to securely load your account and records. Reconnect and try again.</p>
    <button type="button" onclick="window.location.reload()">Try again</button>
  </main>
</body>
</html>
